<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Full Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Outer Key Border -->
  <rect x="96" y="96" width="320" height="320" rx="48" fill="url(#keyGrad)" stroke="#334155" stroke-width="8" />

  <!-- Subtle inner key top bevel -->
  <rect x="120" y="120" width="272" height="236" rx="32" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="2" />

  <!-- Pulse Waveform & Caret in center -->
  <path d="M 160 256 L 210 256 L 235 190 L 275 320 L 305 240 L 325 256 L 352 256" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Blinking Caret accent -->
  <rect x="325" y="195" width="8" height="36" rx="4" fill="#38bdf8" />
</svg>
